name: CI

on:
  push:
    branches: [main]
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install shellcheck
        run: brew install shellcheck

      - name: Shell syntax and lint
        run: |
          set -e
          for f in scripts/*.sh tests/*.sh */*/run.sh; do
            echo "checking $f"
            bash -n "$f"
            shellcheck "$f"
          done

      - name: Result-builder regression tests
        run: |
          sh tests/make-result-test.sh
          sh tests/make-race-window-result-test.sh

      - name: Every repro.m compiles
        run: |
          set -e
          status=0
          while IFS= read -r -d '' repro; do
            echo "compiling $repro"
            clang -fsyntax-only -fobjc-arc -framework Foundation -framework LocalAuthentication "$repro" || status=1
          done < <(find . -name repro.m -print0)
          exit $status

      - name: README sitemap is up to date
        run: |
          ./scripts/make-sitemap.sh
          git diff --exit-code README.md
