name: Track

on:
  schedule:
    # Monthly, matching GitHub's own cadence for rebuilding the hosted
    # macOS runner images (actions/runner-images: "we typically deploy
    # weekly updates to the software on the runner images", so a monthly
    # run is never re-checking a build it already checked, with margin).
    - cron: "17 6 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  track:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15, xcode-27]
    runs-on: ${{ matrix.runner }}
    # One job per image runs every method in turn, which stays within
    # GitHub's five concurrent macOS jobs.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - name: Run every reproduction and record the results
        id: run
        continue-on-error: true
        run: |
          xcode_version=$(xcodebuild -version | head -1 | awk '{print $2}')
          ./scripts/track-all.sh "gh-actions-${{ matrix.runner }}" "$xcode_version" 900

      - name: Commit the results and the sitemap if they changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- */*/results
          git diff --cached --quiet && exit 0
          git commit -m "Track every method on ${{ matrix.runner }}"
          results_commit=$(git rev-parse HEAD)
          # The other runners push concurrently, so the sitemap is regenerated
          # after each rebase from the results then on main.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset -q --hard "$results_commit"
            if git rebase origin/main; then
              results_commit=$(git rev-parse HEAD)
              ./scripts/make-sitemap.sh
              git add README.md
              git diff --cached --quiet || git commit -q --amend --no-edit
              git push origin HEAD:main && exit 0
            else
              git rebase --abort
            fi
            sleep $((attempt * 10))
          done
          echo "could not push the results after 5 attempts" >&2
          exit 1

      - name: Fail if any method failed or timed out
        if: steps.run.outcome == 'failure'
        run: exit 1
