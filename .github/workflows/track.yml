name: Track

on:
  schedule:
    # Monthly, matching GitHub's own cadence for rebuilding the hosted
    # macOS runner images (actions/runner-images: "we typically deploy
    # weekly updates to the software on the runner images", so a monthly
    # run is never re-checking a build it already checked, with margin).
    - cron: "17 6 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  track:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15, xcode-27]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Run the LAContext counter race repro
        working-directory: LocalAuthentication/newInstanceId-newCommandId-race
        run: |
          clang -O2 -fobjc-arc -framework Foundation -framework LocalAuthentication repro.m -o repro
          {
            date -u +%Y-%m-%dT%H:%M:%SZ
            sw_vers
            ./repro direct 1 16000000
            for i in 1 2 3; do ./repro direct 16 1000000; done
            for i in 1 2 3; do ./repro new 8 3000; done
            date -u +%Y-%m-%dT%H:%M:%SZ
          } | tee output.txt

      - name: Record the result
        working-directory: LocalAuthentication/newInstanceId-newCommandId-race
        run: |
          xcode_version=$(xcodebuild -version | head -1 | awk '{print $2}')
          ../../scripts/make-result.sh "gh-actions-${{ matrix.runner }}" output.txt results "$xcode_version"
          rm output.txt

      - name: Commit the result if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add LocalAuthentication/newInstanceId-newCommandId-race/results
          git diff --cached --quiet && exit 0
          git commit -m "Track newInstanceId/newCommandId race on ${{ matrix.runner }}"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && break
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
