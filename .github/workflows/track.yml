name: Track

on:
  schedule:
    # Monthly, matching GitHub's own cadence for rebuilding the hosted
    # macOS runner images (actions/runner-images: "we typically deploy
    # weekly updates to the software on the runner images", so a monthly
    # run is never re-checking a build it already checked, with margin).
    - cron: "17 6 1 * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  track:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15, xcode-27]
        method:
          - LocalAuthentication/newInstanceId-newCommandId-race
          - LocalAuthentication/biometryType-domainState-cache
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Run the reproduction and record the result
        working-directory: ${{ matrix.method }}
        run: |
          xcode_version=$(xcodebuild -version | head -1 | awk '{print $2}')
          ./run.sh "gh-actions-${{ matrix.runner }}" "$xcode_version"

      - name: Commit the result if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${{ matrix.method }}/results"
          git diff --cached --quiet && exit 0
          git commit -m "Track ${{ matrix.method }} on ${{ matrix.runner }}"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main && git push origin HEAD:main && break
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 10))
          done
